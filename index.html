<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixote Achados</title>
<meta name="description" content="Os achadinhos de casa e cozinha dos vídeos do Caixote, numerados.">
<link rel="icon" href="perfil.png">
<style>
  :root { --fundo: #fff7e6; --card: #ffffff; --texto: #1b1b22; --suave: #6b6b75; --amarelo: #ffd21f; --vermelho: #ff3b30; --borda: #f0e2c4; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #17150f; --card: #24211a; --texto: #f5f1e8; --suave: #b3ab9a; --borda: #3a3428; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { text-align: center; }
  header img { width: 104px; height: 104px; border-radius: 50%; border: 4px solid var(--amarelo); object-fit: cover; background: var(--amarelo); }
  h1 { margin: 10px 0 2px; font-size: 26px; font-weight: 900; }
  .sub { margin: 0; color: var(--suave); font-size: 15px; }
  .busca { display: flex; gap: 8px; margin: 18px 0 8px; }
  .busca input { flex: 1; min-width: 0; font-size: 20px; font-weight: 800; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--borda); background: var(--card); color: var(--texto); }
  .busca input:focus { outline: 3px solid var(--amarelo); border-color: transparent; }
  .aviso { font-size: 12.5px; color: var(--suave); text-align: center; margin: 4px 0 18px; }
  .lista { display: grid; gap: 12px; }
  .item { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--borda); border-radius: 18px; padding: 10px; text-decoration: none; color: inherit; position: relative; transition: transform .15s; }
  .item:active { transform: scale(.98); }
  .item.alvo { border-color: var(--amarelo); box-shadow: 0 0 0 4px rgba(255,210,31,.45); }
  .foto { width: 88px; height: 88px; border-radius: 12px; object-fit: cover; background: #eee; display: grid; place-items: center; font-size: 36px; }
  .num { position: absolute; top: -8px; left: -6px; background: var(--amarelo); color: #111; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 999px; border: 2px solid #111; }
  .nome { font-weight: 800; font-size: 16px; line-height: 1.25; margin: 0 0 6px; }
  .linha { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .preco { font-weight: 900; font-size: 18px; color: var(--vermelho); }
  .ver { background: var(--vermelho); color: #fff; font-weight: 800; font-size: 14px; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
  .vazio { text-align: center; color: var(--suave); padding: 24px 0; }
  footer { text-align: center; color: var(--suave); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="perfil.png" alt="Caixote, a caixinha dos achados">
    <h1>Caixote Achados 📦</h1>
    <p class="sub">Achadinhos de casa e cozinha dos vídeos</p>
  </header>
  <div class="busca"><input id="q" type="search" inputmode="numeric" placeholder="Digite o nº do vídeo" aria-label="Número do achadinho"></div>
  <p class="aviso">#publi · Os links são de afiliado: posso ganhar uma comissão, sem custo extra pra você. Preços podem mudar na loja.</p>
  <div class="lista" id="lista"></div>
  <footer>Toque no produto para abrir na loja.</footer>
</main>
<script>
  const lista = document.getElementById("lista"), q = document.getElementById("q");
  let produtos = [];
  const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function mostra() {
    const termo = q.value.trim().toLowerCase().replace(/^n[ºo°]?\s*/, "");
    const alvo = /^\d+$/.test(termo) ? Number(termo) : null;
    const itens = produtos.filter((p) => !termo || (alvo !== null ? p.numero === alvo : (p.nome || "").toLowerCase().includes(termo)));
    lista.innerHTML = itens.length ? itens.map((p) => `
      <a class="item${alvo === p.numero ? " alvo" : ""}" id="n${p.numero}" href="${esc(p.link)}" target="_blank" rel="sponsored noopener">
        <span class="num">nº ${p.numero}</span>
        ${p.foto ? `<img class="foto" src="${esc(p.foto)}" alt="" loading="lazy">` : `<div class="foto">📦</div>`}
        <div><p class="nome">${esc(p.nome)}</p><div class="linha"><span class="preco">${esc(p.preco)}</span><span class="ver">Ver na loja ›</span></div></div>
      </a>`).join("") : `<p class="vazio">Não achei esse número 😕 Confere no vídeo!</p>`;
  }
  q.addEventListener("input", mostra);
  fetch("produtos.json", { cache: "no-store" }).then((r) => r.json()).then((d) => {
    produtos = d.sort((a, b) => b.numero - a.numero);
    const h = location.hash.replace("#", ""); if (/^\d+$/.test(h)) q.value = h;
    mostra();
  }).catch(() => { lista.innerHTML = `<p class="vazio">Não consegui carregar os produtos agora.</p>`; });
</script>
</body>
</html>
